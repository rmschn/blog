baseurl = "https://rayschneider.net"
title = "Ray Schneider"

theme = "coder-portfolio"

DefaultContentLanguage = "en"

paginate = 20

pygmentsstyle = "b2"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true
pygmentsUseClasses = true

#disqusShortname = "yourdiscussshortname"

[params]
    author = "Ray Schneider"
    description = "Ray Schneider personal website"
    keywords = "blog,programming,developer,personal,tech,security,cloud,automation,leadership"
    info = "improvise. adapt. overcome."
    avatarurl = "avatar.jpg"
    footercontent = "Copyright (C) 2025 Ray Schneider. All Rights Reserved."
    fixedbarContent = "Thank You! Feel free to share→"
    fixedbarContentAfter = "Thank You! Please share it if you like it→"

    #hideCredits = false
    #hideCopyright = false

    # Bottom sns share
    snsShare = true
    # Popular sns share
    # if you want add sns. please message!
    enableTwitterShare = true
    enableFacebookShare = true
    enableHatenaShare = true
    enableLineShare = true
    enableLinkedInShare = true

    thumbnail = "images/tn.png"

    # Custom CSS
    custom_css = []

    # Alignment of Mobile Menu items
    itemscentered = true

    # RTL support
    rtl = false

    langseparator = "|"

[[params.social]]
    name = "Github"
    icon = "fab fa-github"
    weight = 1
    url = "https://github.com/rmschn/"

[languages]
    [languages.en]
        languagecode = "en"
        languagename = "English" # The language name to be displayed in the selector.
        title = "Ray Schneider"

        # You can configure the theme parameter for each language.
        [languages.en.params]
    		author = "Ray Schneider"
    		description = "Ray Schneider personal website"
    		keywords = "blog,developer,personal,tech,security,cloud,automation,leadership"
    		info = "improvise. adapt. overcome."
            footercontent = "Copyright (C) 2025 Ray Schneider. All Rights Reserved."
        [languages.en.menu] # It is possible to change the menu too.

            [[languages.en.menu.main]]
                name = "About"
                weight = 1.0
                url = "about"

            [[languages.en.menu.main]]
                name = "Blog"
                weight = 2.0
                url = "posts"

